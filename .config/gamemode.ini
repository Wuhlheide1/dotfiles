; GameMode, tuned for Roblox/Sober on the 5950X + RX 7800 XT (2026-10-25).
; Sober starts GameMode itself (enable_gamemode in its config); Steam games
; need `gamemoderun %command%`.
;
; Needs the user in the `gamemode` group (done 2026-10-25; Arch ships a polkit
; rule + limits.d "nice -10" for it). renice only works after a fresh login,
; when the user manager picks up the new nice limit.
; The [gpu] section (GPU clocks to "high" while playing) is in /etc/gamemode.ini:
; GameMode ignores [gpu] in this file as an "unsafe config file".
; Check while a game runs: journalctl --user -u gamemoded -b

[general]
; Game threads at nice -10, so Brave/Discord/the shell yield to them.
renice=10
; Harmless journal noise: "Skipping ioprio ... was (0) but we expected (4)" for
; every Sober thread. ioprio=off does NOT silence it (1.8.2 clamps "off" to 0).

[custom]
; Power profile (2026-11-10 audit): the desktop runs "balanced"; games get
; "performance" only while they run (Sober, and Steam games with gamemoderun).
start=powerprofilesctl set performance
end=powerprofilesctl set balanced
