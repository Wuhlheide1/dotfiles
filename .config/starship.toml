# Starship prompt — deliberately quiet: directory, git, duration, prompt char.
# Glyphs are Nerd Font (kitty's font renders them).

add_newline = true

format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold #b8c078"

[git_branch]
symbol = " "
style = "dimmed white"
format = "on [$symbol$branch]($style) "

[git_status]
style = "dimmed yellow"

[cmd_duration]
min_time = 3000
style = "dimmed white"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold #b8c078)"
error_symbol = "[❯](bold red)"
