# hyprlock — lock screen (bound to SUPER+L, also used by hypridle).
# Background is a blurred snapshot of the live screen (`path = screenshot`), so
# it always matches the current wallpaper/matugen theme without extra config.

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

# Big clock
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.92)
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.72)
    position = 0, 140
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    rounding = 14
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(20, 20, 28, 0.65)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffbb">Locked — enter password</span>
    check_color = rgba(120, 200, 140, 1.0)
    fail_color = rgba(220, 90, 90, 1.0)
    fail_text = <span foreground="##ffffff">$FAIL ($ATTEMPTS)</span>
    position = 0, -40
    halign = center
    valign = center
}
