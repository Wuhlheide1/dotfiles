# hypridle — idle management (autostarted from autostart.lua).
# Desktop box (no battery), so timeouts are generous: lock at 5 min, blank the
# monitor at 10 min. lock_cmd is guarded so hyprlock never stacks.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 minutes idle: lock the session (fires lock_cmd via logind).
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 minutes idle: turn the monitor off; wake on input.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
