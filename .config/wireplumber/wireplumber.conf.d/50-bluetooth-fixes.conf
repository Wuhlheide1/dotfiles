# Bluetooth audio fixes (2026-07-06) — loud random static bursts on the
# Galaxy Buds3 Pro.
#
# 1. Drop AAC from the codec list: PipeWire's AAC encode to Samsung buds is a
#    known source of intermittent loud noise spikes. SBC-XQ sounds as good
#    and is stable. (The active profile was also switched to sbc_xq by hand;
#    this makes sure AAC never gets auto-picked again for any device.)
# 2. Never auto-switch to the HFP/HSP headset profile when an app opens a
#    mic (vesktop runs permanently and Discord likes to grab mics) — the
#    Blue Snowball is the real microphone here, and A2DP<->HFP flapping both
#    pops and tanks quality.

monitor.bluez.properties = {
  bluez5.codecs = [ sbc_xq sbc ]
  bluez5.enable-msbc = true
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
