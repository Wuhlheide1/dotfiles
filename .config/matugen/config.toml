# matugen configuration
# Canonical invocation lives in ~/.config/quickshell/scripts/wallpaper.sh:
#       matugen image <wallpaper> -t scheme-content --source-color-index 0
# scheme-content keeps the wallpaper's real color as the accent (tonal-spot
# pastel-shifts it); index 0 = most dominant color, skips the picker prompt.
# One-off runs:  matugen color hex "#7dcfff"   (palette from one color)
#
# Each [templates.NAME] block reads input_path, fills in the {{colors.*}}
# placeholders, and writes the result to output_path. matugen expands ~.

[config]

# Accents only — Colors.qml itself is hand-written and watches this JSON so
# it can ANIMATE to the new palette (writing a .qml would hard-reload the shell).
[templates.quickshell]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/colors.json'

[templates.hyprland]
input_path  = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.hyprlock]
input_path  = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'
