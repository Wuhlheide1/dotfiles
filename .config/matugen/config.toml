# matugen configuration
# Run:  matugen image /path/to/wallpaper.png        (uses default scheme/mode)
#       matugen image /path/to/wallpaper.png -m dark
#       matugen color hex "#7dcfff"                  (palette from one color)
#
# Each [templates.NAME] block reads input_path, fills in the {{colors.*}}
# placeholders, and writes the result to output_path. matugen expands ~.

[config]
# Material You scheme. Options include: scheme-tonal-spot (default),
# scheme-content, scheme-expressive, scheme-fidelity, scheme-vibrant,
# scheme-neutral, scheme-monochrome.
# scheme = "scheme-tonal-spot"

[templates.quickshell]
input_path = '~/.config/matugen/templates/Colors.qml'
output_path = '~/.config/quickshell/Colors.qml'

[templates.kitty]
input_path  = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/colors-matugen.conf'
# reload colors in already-open kitty windows (exact-name pkill is safe)
post_hook   = 'pkill -USR1 -x kitty || true'

[templates.hyprland]
input_path  = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.config/hypr/colors.lua'
