[terminal]
vt = 1

[default_session]
# Default now launches Hyprland via uwsm (the exact command from the working
# "Hyprland (uwsm-managed)" session), and --remember-session makes your last
# pick stick. So a plain login starts Hyprland with no manual selection.
command = "tuigreet --remember --remember-session --time --asterisks --cmd 'uwsm start -e -D Hyprland hyprland.desktop'"
user = "greeter"
