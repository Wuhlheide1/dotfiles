# Font — Nerd Font so fastfetch/powerline glyphs render
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Sensible defaults
enable_audio_bell no

# Wallpaper-matched chrome colors, regenerated by matugen on wallpaper change
include colors-matugen.conf
