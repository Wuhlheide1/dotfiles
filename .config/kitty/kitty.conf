# Font — GitHub's Monaspace superfamily (picked 2026-10-13 from a live
# side-by-side: "B"). Argon (humanist, calm) for text and a SemiBold of the
# same family for bold; Radon (handwritten) for italics, which is mostly
# comments. The families share exact metrics, so mixing them per style is what
# the superfamily is built for. Nerd Font glyphs need no patched font: kitty
# ships Symbols Nerd Font Mono built in.
# Features: calt = texture healing (m/w borrow room from narrow neighbours
# like i/l), liga + ss01-ss09 = coding ligatures (-> != >= ...).
# Xenon Bold is NOT used: it read as too aggressive, and with calt on kitty
# squeezed its healed glyphs (a shrunken m/w in "Uptime", "SwitchFolder").
font_family      family="Monaspace Argon" style="Regular" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09"
bold_font        family="Monaspace Argon" style="SemiBold" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09"
italic_font      family="Monaspace Radon" style="Italic" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09"
bold_italic_font family="Monaspace Radon" style="Bold Italic" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09"
font_size        12.0
# A little air between lines; box-drawing characters still join up because
# kitty draws those itself.
modify_font      cell_height 108%

# Sensible defaults
enable_audio_bell no
scrollback_lines  10000
# Copying a selection drops the trailing blanks the terminal padded it with.
strip_trailing_spaces smart

# Breathing room so text doesn't touch the window border.
window_padding_width 4 8

# Fish in the terminal without touching the login shell (scripts stay bash).
# Applies to newly opened kitty windows/tabs.
shell fish

# Copy: selecting text copies it immediately. Ctrl+C copies when a selection
# exists, otherwise sends SIGINT as usual. (SUPER+C can't work here — Hyprland
# grabs it globally for window-close before kitty ever sees it.)
copy_on_select yes
map ctrl+c copy_or_interrupt

# Cursor: a beam that fades instead of hard-blinking and stops blinking after
# 15s idle, plus a short trail when it jumps (cd, scrolling, nvim motions) so
# your eye can follow it. cursor_trail 0 turns the trail off.
cursor_shape               beam
cursor_blink_interval      0.6 ease-in-out
cursor_stop_blinking_after 15
cursor_trail               3
cursor_trail_decay         0.08 0.3

# The main panel runs at 280 Hz: repaint often enough to use it.
repaint_delay 4
input_delay   1

# Tabs (only shown with 2+ tabs): slanted, coloured by the scheme include.
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   " {index}  {title[:30]} "

# A command that ran 15s+ while the terminal was unfocused sends a desktop
# notification when it finishes (needs shell integration, on by default).
notify_on_cmd_finish unfocused 15.0

# Colours follow the Caelestia scheme (and therefore the wallpaper), rendered
# by ~/.config/caelestia/hooks/theme-post.py, which also sends kitty SIGUSR1 so
# open windows reload. To go back: delete this include and restore
# kitty.conf.pre-caelestia-bak.
include /home/wuhlheide/.local/state/caelestia/theme/kitty.conf

# Slightly translucent; Hyprland's decoration blur kicks in automatically
# for transparent windows, so this reads as frosted glass.
# 0.93
background_opacity 0.88
# lets a config reload (SIGUSR1) apply opacity changes to running windows
dynamic_background_opacity yes
