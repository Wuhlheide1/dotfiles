# Font — Nerd Font so fastfetch/powerline glyphs render
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Sensible defaults
enable_audio_bell no

# Fish in the terminal without touching the login shell (scripts stay bash).
# Applies to newly opened kitty windows/tabs.
shell fish

# Copy: selecting text copies it immediately. Ctrl+C copies when a selection
# exists, otherwise sends SIGINT as usual. (SUPER+C can't work here — Hyprland
# grabs it globally for window-close before kitty ever sees it.)
copy_on_select yes
map ctrl+c copy_or_interrupt

# Colours follow the Caelestia scheme (and therefore the wallpaper). This
# REVERSES the old "static neutral chrome" choice from the matugen era - that
# objection was that matugen drifted the whole surface warm/cool per wallpaper.
# Caelestia keeps surfaces near-black and only moves the accent, so the reason
# for pinning them is gone. To go back: delete this include and restore
# kitty.conf.pre-caelestia-bak.
include /home/wuhlheide/.local/state/caelestia/theme/kitty.conf

# Slightly translucent; Hyprland's decoration blur kicks in automatically
# for transparent windows, so this reads as frosted glass.
background_opacity 0.93
# lets a config reload (SIGUSR1) apply opacity changes to running windows
dynamic_background_opacity yes
