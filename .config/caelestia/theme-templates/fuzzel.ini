# Rendered by ~/.config/caelestia/hooks/theme-post.py on every scheme/wallpaper change to
# ~/.local/state/caelestia/theme/fuzzel.ini, which ~/.config/fuzzel/fuzzel.ini
# symlinks to. Caelestia's own fuzzel themer is disabled in cli.json
# (theme.enableFuzzel = false) so it cannot overwrite this.
#
# NOTE the placeholder syntax: USER templates use {{ name.form }}, NOT the
# {{ $name }} used by caelestia's built-in templates - a {{ $name }} here is
# silently left as literal text. Forms: hex, hexalpha, rgb, rgbalpha, hsl,
# red/green/blue, hue/saturation/lightness. `hex` is bare (no leading #),
# which is what fuzzel wants, with the alpha appended as 2 hex digits.
font=JetBrains Mono NF:size=17
terminal=kitty -e
prompt="> "
layer=overlay
lines=15
width=60
dpi-aware=no
inner-pad=10
horizontal-pad=40
vertical-pad=15
match-counter=yes

[colors]
background={{ surface.hex }}dd
text={{ onSurface.hex }}dd
prompt={{ primary.hex }}ff
placeholder={{ outline.hex }}ff
input={{ onSurface.hex }}ff
match={{ tertiary.hex }}ff
selection={{ primary.hex }}87
selection-text={{ onSurface.hex }}ff
selection-match={{ tertiary.hex }}ff
counter={{ outline.hex }}ff
border={{ primary.hex }}77

[border]
radius=10
width=2
