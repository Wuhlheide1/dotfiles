# Rendered by ~/.config/caelestia/hooks/theme-post.py to
# ~/.local/state/caelestia/theme/kitty.conf and pulled in by
# ~/.config/kitty/kitty.conf via `include`; the hook then sends kitty SIGUSR1.
# ANSI colours are the hook's ansiN (honest hues, lightly tinted toward the
# accent), NOT Caelestia's termN, which bends red/yellow into the accent.
background            #{{ surface.hex }}
foreground            #{{ onSurface.hex }}
cursor                #{{ primary.hex }}
cursor_text_color     #{{ surface.hex }}

selection_background  #{{ primary.hex }}
selection_foreground  #{{ surface.hex }}
url_color             #{{ tertiary.hex }}
url_style             curly

active_border_color   #{{ primary.hex }}
inactive_border_color #{{ outline.hex }}

active_tab_background   #{{ surfaceContainerHigh.hex }}
active_tab_foreground   #{{ onSurface.hex }}
inactive_tab_background #{{ surfaceContainer.hex }}
inactive_tab_foreground #{{ onSurfaceVariant.hex }}
tab_bar_background      #{{ surface.hex }}

color0  #{{ ansi0.hex }}
color1  #{{ ansi1.hex }}
color2  #{{ ansi2.hex }}
color3  #{{ ansi3.hex }}
color4  #{{ ansi4.hex }}
color5  #{{ ansi5.hex }}
color6  #{{ ansi6.hex }}
color7  #{{ ansi7.hex }}
color8  #{{ ansi8.hex }}
color9  #{{ ansi9.hex }}
color10 #{{ ansi10.hex }}
color11 #{{ ansi11.hex }}
color12 #{{ ansi12.hex }}
color13 #{{ ansi13.hex }}
color14 #{{ ansi14.hex }}
color15 #{{ ansi15.hex }}

# Search / marks
mark1_background #{{ primaryContainer.hex }}
mark1_foreground #{{ onPrimaryContainer.hex }}
mark2_background #{{ tertiaryContainer.hex }}
mark2_foreground #{{ onTertiaryContainer.hex }}
mark3_background #{{ secondaryContainer.hex }}
mark3_foreground #{{ onSecondaryContainer.hex }}
visual_bell_color #{{ primary.hex }}
