# fcitx5 Japanese IME routing for Qt/GTK/XWayland apps.
#
# This duplicates hl.env() in ~/.config/hypr/environmentVariables.lua on
# purpose: Hyprland 0.56.2's native Lua config `env` directive updates what
# Hyprland's own os.getenv() sees but does NOT call real setenv() for its
# process — verified by spawning via hl.dsp.exec_cmd (the same dispatcher
# keybinds.lua uses) and finding the var absent from the child's own
# /proc/self/environ, even after `hyprctl reload`. Likely an upstream bug in
# the still-new Lua config support.
#
# environment.d is read by systemd --user during PAM session startup, before
# ANY process in the graphical session exists (Hyprland included), so it
# sidesteps the bug entirely via real inheritance. Takes effect on next
# login/reboot — does not retroactively fix the currently-running session.
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
