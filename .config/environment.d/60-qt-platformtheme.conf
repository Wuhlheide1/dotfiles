# Qt platform theme. Was gtk3 (which borrowed the icon theme from GTK settings);
# now qtengine, which is Caelestia's own. `caelestia scheme` writes
# ~/.config/qtengine/{config.json,caelestia.colors} on every scheme change, so
# Qt apps (dolphin, krita, qbittorrent) follow the wallpaper and use the Darkly
# widget style. qtengine sets the icon theme itself (Papirus-Dark), which is
# what stops the tray, launcher icons and file pickers rendering blank.
#
# This lives in environment.d rather than hl.env() for the reason documented in
# im-modules.conf: Hyprland 0.56.2's Lua `env` updates Hyprland's own view of
# the environment but does not reach spawned children. environment.d is read by
# systemd --user at PAM session start, before anything in the session exists.
# Takes effect at the next login.
QT_QPA_PLATFORMTHEME=qtengine
