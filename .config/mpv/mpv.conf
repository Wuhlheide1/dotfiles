# Colours follow the Caelestia scheme (regenerated on every wallpaper change).
include=~/.local/state/caelestia/theme/mpv-colours.conf

# Hardware decoding on the RX 7800 XT. This is the same VA-API path that fixed
# the browser video stalling - mpv defaults to software decode otherwise.
hwdec=vaapi
vo=gpu-next
gpu-api=vulkan
profile=high-quality

# Sensible behaviour
keep-open=yes
save-position-on-quit=yes
osd-bar=yes
osd-font-size=32
volume=80
volume-max=150
screenshot-directory=~/images/screenshots
screenshot-format=png

# Japanese study: prefer Japanese audio, and don't auto-pick a dub
alang=jpn,ja,eng,en
slang=eng,en,jpn,ja
sub-auto=fuzzy
