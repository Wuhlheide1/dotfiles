# 2026-11-10 (audit): the daily catch-up ran right at login and peaked at 4.5 GB RAM.
[Service]
# Go's garbage collector runs more often: restic's RAM peak drops to roughly a
# third, for a little more CPU time.
Environment=GOGC=20
# Not before the PC has been up 20 minutes (the timer's Persistent= catch-up
# fires at login). Later runs start right away.
ExecStartPre=%h/.local/bin/wait-uptime 1200
